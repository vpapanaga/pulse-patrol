services:
  # DATABASE: PostgreSQL with Auto-Initialization from scripts/
  db:
    image: postgres:15-alpine
    container_name: pulse-patrol-database
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      # UPDATED PATH: Mounts the schema from your scripts folder
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # PROVISIONING SERVICE: Benchmark Target
  provisioning-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: pulse-provisioning
    env_file:
      - .env
    ports:
      - "${REST_PORT:-8090}:${REST_PORT:-8090}"
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: